<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="zondaxxx">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#c9c9d6"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .drift { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes drift { to { transform: translate(40px, -20px); } }
      .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
      @keyframes drift2 { to { transform: translate(-50px, 15px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g class="drift"><circle cx="220" cy="80" r="260" fill="url(#glowA)" filter="url(#blur)"/></g>
    <g class="drift2"><circle cx="1030" cy="290" r="280" fill="url(#glowB)" filter="url(#blur)"/></g>

    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.035">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M300 0V320M600 0V320M900 0V320"/>
    </g>

    <!-- name -->
    <text class="mono" x="80" y="176" font-size="88" font-weight="600" fill="url(#text)" letter-spacing="-2">zondaxxx<tspan class="cursor" fill="#7c5cff">_</tspan></text>

    <!-- tagline -->
    <text class="mono" x="84" y="222" font-size="18" fill="#9a9aae" letter-spacing="3">FULL-STACK · MOBILE · NETWORKS</text>

    <!-- right side -->
    <text class="mono" x="1120" y="70" font-size="14" fill="#6f6f80" text-anchor="end" letter-spacing="2">BMSTU · IU5</text>
    <text class="mono" x="1120" y="94" font-size="14" fill="#6f6f80" text-anchor="end" letter-spacing="2">MOSCOW</text>

    <!-- bottom line -->
    <rect x="80" y="262" width="1040" height="1" fill="url(#line)"/>

    <!-- border -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
